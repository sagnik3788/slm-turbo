[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-turbo"
version = "0.1.1"
description = "Automated LLM inference optimizer — profiles your GPU, diagnoses bottlenecks, and prescribes targeted optimizations (KV quantization, prefix cache, chunked prefill, backend selection) as a versioned recipe."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "SLM Turbo contributors"}]
keywords = ["llm", "inference", "optimization", "gpu", "cuda", "vllm", "kv-cache", "quantization", "roofline", "triton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20.0",
    "nvidia-ml-py>=12.0",
]

# vLLM is heavy and platform-locked; only `slm-turbo serve` needs it.
# Install with: pip install "slm-turbo[gpu]"
[project.optional-dependencies]
gpu = ["vllm>=0.4.0"]

[project.scripts]
slm-turbo = "cli:app"

# vLLM plugin entry point: loaded in every vLLM process (process0, EngineCore,
# workers) so the CUSTOM attention backend override is registered process-wide.
[project.entry-points."vllm.general_plugins"]
slm-turbo = "adapters.vllm_adapter:register_plugin"

[tool.setuptools]
py-modules = [
    "schema",
    "topology",
    "profiler",
    "roofline",
    "optimizers",
    "recipe",
    "cli",
]
packages = ["adapters", "kernels", "kernels.benchmark"]

[tool.setuptools.package-data]
kernels = ["*.cu", "*.cuh"]
