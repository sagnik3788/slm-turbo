[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-turbo"
version = "0.1.0"
description = "Automated LLM inference optimizer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "vllm>=0.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20.0",
    "nvidia-ml-py>=12.0",
]

[project.scripts]
slm-turbo = "cli:app"

[tool.setuptools]
py-modules = [
    "schema",
    "topology",
    "profiler",
    "roofline",
    "optimizers",
    "recipe",
    "cli",
]
